<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 日报 · 开源排行 / 热门项目 / 知识库 / 提示词 / 工具导航</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --ink: #1a1a2e; --paper: #f7f8fc; --accent: #6c3ce0; --accent2: #00b894;
    --muted: #8a8fa3; --card: #fff; --line: #e8eaf2; --gold: #d4a017; }
  body { font-family: -apple-system, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--paper); color: var(--ink); }
  #app { display: flex; min-height: 100vh; }
  header { position: fixed; top: 0; left: 280px; right: 0; z-index: 50;
    background: linear-gradient(120deg, #1a1a2e, #2d1b69); color: #fff;
    padding: 14px 28px; display: flex; align-items: center; gap: 14px; border-bottom: 3px solid var(--accent); }
  header h1 { font-size: 20px; letter-spacing: 4px; }
  header h1 .dot { color: #a78bfa; }
  header p { font-size: 12px; color: #b9b3d9; margin-left: auto; text-align: right; line-height: 1.6; }
  #sidebar { width: 280px; background: #16162a; color: #c9c4e0; position: fixed; top: 0; bottom: 0; overflow-y: auto; z-index: 100; }
  #sidebar .brand { padding: 22px 20px 16px; border-bottom: 1px solid #2a2a4a; }
  #sidebar .brand h2 { font-size: 18px; letter-spacing: 4px; color: #fff; }
  #sidebar .brand small { font-size: 11px; color: #8a86b3; display: block; margin-top: 6px; line-height: 1.7; }
  #dates { padding: 10px 0 40px; }
  .date-item { display: block; padding: 13px 20px; cursor: pointer; border-left: 3px solid transparent; text-decoration: none; color: inherit; }
  .date-item:hover { background: #20203a; }
  .date-item.active { background: #20203a; border-left-color: var(--accent); }
  .date-item .d { font-size: 16px; font-weight: bold; color: #fff; }
  .date-item .w { font-size: 12px; color: #a78bfa; margin-left: 8px; }
  .date-item .c { font-size: 12px; color: #8a86b3; margin-top: 3px; }
  #main { margin-left: 280px; margin-top: 62px; flex: 1; max-width: 1100px; padding: 24px 32px 100px; }
  #day-title { margin-bottom: 18px; display: flex; align-items: baseline; gap: 14px; }
  #day-title h2 { font-size: 24px; letter-spacing: 2px; }
  #day-title span { color: var(--muted); font-size: 14px; }
  /* 板块导航 */
  #secnav { position: sticky; top: 62px; z-index: 40; background: var(--paper); padding: 10px 0;
    display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  #secnav a { font-size: 14px; padding: 8px 16px; border-radius: 20px; background: #fff; border: 1px solid var(--line);
    color: var(--ink); text-decoration: none; }
  #secnav a:hover { border-color: var(--accent); color: var(--accent); }
  section.block { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px 26px; margin: 22px 0; scroll-margin-top: 130px; }
  section.block > h2 { font-size: 20px; margin-bottom: 4px; }
  section.block > .sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .tabs button { font-size: 13px; padding: 7px 14px; border-radius: 16px; border: 1px solid var(--line);
    background: #f4f5fa; cursor: pointer; }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .repo { display: flex; gap: 14px; padding: 13px 4px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .repo:last-child { border-bottom: none; }
  .repo .rank { font-size: 20px; font-weight: 800; color: var(--gold); min-width: 30px; text-align: center; }
  .repo .info { flex: 1; min-width: 0; }
  .repo .info a { font-size: 15.5px; font-weight: bold; color: var(--ink); text-decoration: none; }
  .repo .info a:hover { color: var(--accent); }
  .repo .info p { font-size: 13px; color: #555a70; margin-top: 4px; line-height: 1.6; }
  .repo .meta { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
  .stars { color: var(--gold); font-weight: bold; }
  .delta-up { color: #0b8a42; font-weight: bold; }
  .kcard { border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; background: #fbfbfe; }
  .kcard h3 { font-size: 16px; margin-bottom: 8px; }
  .kcard .tag { font-size: 11px; background: var(--accent); color: #fff; padding: 2px 9px; border-radius: 12px; margin-right: 8px; }
  .kcard p { font-size: 14px; line-height: 1.85; color: #3c3f52; margin: 8px 0; }
  .kcard pre { background: #1e1e2e; color: #e8e8f2; padding: 14px 16px; border-radius: 8px; overflow-x: auto;
    font-size: 13px; line-height: 1.7; margin-top: 10px; font-family: Consolas, monospace; white-space: pre-wrap; }
  .prompt-box { background: #f6f3ff; border: 1px dashed #b9a7f2; border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
  .prompt-box h3 { font-size: 15px; margin-bottom: 8px; }
  .prompt-box pre { white-space: pre-wrap; font-size: 13.5px; line-height: 1.8; color: #3c3f52; font-family: inherit; }
  .prompt-box button { margin-top: 10px; font-size: 13px; padding: 7px 16px; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #fff; border: none; }
  .toolgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .tool { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: #fbfbfe; }
  .tool a { font-size: 14.5px; font-weight: bold; color: var(--ink); text-decoration: none; }
  .tool a:hover { color: var(--accent); }
  .tool p { font-size: 12.5px; color: #555a70; margin-top: 6px; line-height: 1.6; }
  .tool .new { font-size: 11px; background: #ff5b5b; color: #fff; padding: 1px 8px; border-radius: 10px; margin-left: 6px; }
  .catchip { font-size: 12px; color: var(--accent); font-weight: bold; margin: 16px 0 10px; }
  #loading, #empty { text-align: center; padding: 80px 20px; color: var(--muted); font-size: 15px; }
  #menu-btn { display: none; position: fixed; top: 74px; left: 12px; z-index: 200; background: #16162a; color: #fff;
    border: 1px solid #a78bfa; border-radius: 8px; padding: 8px 12px; font-size: 16px; cursor: pointer; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px; line-height: 2; }
  @media (max-width: 860px) {
    #sidebar { transform: translateX(-100%); transition: transform .3s; }
    #sidebar.open { transform: translateX(0); }
    header { left: 0; } header p { display: none; }
    #main { margin-left: 0; padding: 16px 14px 80px; }
    #menu-btn { display: block; }
    #secnav { top: 62px; }
  }
</style>
</head>
<body>
<button id="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ 日期</button>
<div id="app">
  <nav id="sidebar">
    <div class="brand">
      <h2>AI 日报</h2>
      <small>开源排行 · 热门项目 · 知识库<br>提示词 · 工具导航 · 每日 8 点更新</small>
    </div>
    <div id="dates"><div style="padding:20px;color:#8a86b3">加载中…</div></div>
  </nav>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header>
      <h1>AI 日报<span class="dot">·</span></h1>
      <p>GitHub 数据每日抓取 · 知识库每日累积<br>一个页面 · 五个板块</p>
    </header>
    <main id="main">
      <div id="day-title" style="display:none"><h2 id="day-h"></h2><span id="day-c"></span></div>
      <nav id="secnav" style="display:none">
        <a href="#s1">🏆 AI 排行榜</a><a href="#s2">📊 语言热门榜</a><a href="#s3">📚 知识库</a><a href="#s4">💬 提示词</a><a href="#s5">🧰 工具导航</a>
      </nav>
      <div id="list"><div id="loading">正在加载…</div></div>
      <footer>GitHub 数据来自官方 API，模型数据来自 HuggingFace。<br>知识库与提示词为本站原创整理，每日累积。</footer>
    </main>
  </div>
</div>
<script>
const WEEK = ['日','一','二','三','四','五','六'];
let dates = [];
const esc = s => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const weekday = d => '周' + WEEK[new Date(...d.split('-').map(Number).map((v,i)=>i===1?v-1:v)).getDay()];
const fmtDate = d => { const [y,m,dd] = d.split('-'); return `${y}年${+m}月${+dd}日 ${weekday(d)}`; };
const fmtNum = n => n >= 1000 ? (n/1000).toFixed(1) + 'k' : n;

async function init() {
  try { dates = await (await fetch('data/index.json')).json(); }
  catch (e) {
    document.getElementById('dates').innerHTML = '<div style="padding:20px;color:#8a86b3">暂无数据</div>';
    document.getElementById('list').innerHTML = '<div id="empty">暂无数据，等待首次抓取…</div>';
    return;
  }
  document.getElementById('dates').innerHTML = dates.map(d =>
    `<a class="date-item" data-date="${d.date}" href="#${d.date}">
       <div><span class="d">${d.date.slice(5).replace('-','月')}日</span><span class="w">${weekday(d.date)}</span></div>
       <div class="c">${d.date} · ${d.ai_projects} 个新AI项目 · ${d.models} 个热门模型</div>
     </a>`).join('');
  const h = location.hash.replace('#','');
  const t = dates.some(d => d.date === h) ? h : (dates[0] && dates[0].date);
  if (t) loadDay(t);
  window.addEventListener('hashchange', () => { const hh = location.hash.replace('#',''); if (hh && hh.length === 10) loadDay(hh); });
}

function repoRow(r, i) {
  return `<div class="repo"><div class="rank">${i+1}</div><div class="info">
    <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.full_name || r.name)}</a>
    ${r.desc ? `<p>${esc(r.desc)}</p>` : ''}
    <div class="meta"><span class="stars">★ ${fmtNum(r.stars)}</span>
    ${r.lang ? `<span>${esc(r.lang)}</span>` : ''}
    ${r.delta != null ? `<span class="delta-up">▲ +${fmtNum(r.delta)} /天</span>` : ''}
    ${r.delta === null ? `<span>首日基线</span>` : ''}
    ${r.created ? `<span>创建于 ${esc(r.created)}</span>` : ''}</div>
  </div></div>`;
}

async function loadDay(date) {
  document.querySelectorAll('.date-item').forEach(e => e.classList.toggle('active', e.dataset.date === date));
  document.getElementById('sidebar').classList.remove('open');
  const list = document.getElementById('list');
  list.innerHTML = '<div id="loading">正在加载…</div>';
  document.getElementById('day-title').style.display = 'none';
  document.getElementById('secnav').style.display = 'none';
  try {
    const d = await (await fetch(`data/${date}.json`)).json();
    document.getElementById('day-title').style.display = 'flex';
    document.getElementById('day-h').textContent = fmtDate(date);
    document.getElementById('day-c').textContent = `${d.ai_rank.new_projects.length} 个新AI项目 · 5 语言热门榜`;
    document.getElementById('secnav').style.display = 'flex';
    document.title = `${fmtDate(date)} · AI 日报`;

    // 板块1
    const ai = d.ai_rank;
    const s1 = `<section class="block" id="s1"><h2>🏆 开源 AI 工具排行榜</h2><div class="sub">新发布 AI 项目 · 知名项目 Star 日增长 · HuggingFace 热门模型</div>
      <div class="tabs">
        <button class="on" onclick="swTab('ai',0,this)">🆕 新发布AI项目</button>
        <button onclick="swTab('ai',1,this)">📈 Star 增长</button>
        <button onclick="swTab('ai',2,this)">🤗 热门模型</button>
      </div>
      <div id="ai-tab0">${ai.new_projects.map(repoRow).join('') || '<p style="color:#999">暂无</p>'}</div>
      <div id="ai-tab1" style="display:none">${ai.star_growth.map(repoRow).join('') || '<p style="color:#999">暂无</p>'}</div>
      <div id="ai-tab2" style="display:none">${ai.trending_models.map((m,i) =>
        `<div class="repo"><div class="rank">${i+1}</div><div class="info">
          <a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.id)}</a>
          <div class="meta"><span class="stars">❤ ${fmtNum(m.likes)}</span><span>⬇ ${fmtNum(m.downloads)}</span><span>${esc(m.pipeline)}</span></div>
        </div></div>`).join('')}</div>
    </section>`;

    // 板块2
    const langs = Object.keys(d.lang_trending);
    const s2 = `<section class="block" id="s2"><h2>📊 GitHub 热门项目榜</h2><div class="sub">近 7 天创建 · 按 Star 排序 · 每日更新</div>
      <div class="tabs">${langs.map((l,i) => `<button class="${i===0?'on':''}" onclick="swTab('lang',${i},this)">${esc(l)}</button>`).join('')}</div>
      ${langs.map((l,i) => `<div id="lang-tab${i}" style="${i===0?'':'display:none'}">${(d.lang_trending[l]||[]).map(repoRow).join('') || '<p style="color:#999">暂无</p>'}</div>`).join('')}
    </section>`;

    // 板块3
    const kn = d.knowledge;
    const knames = {python: 'Python', go: 'Go', sql: 'SQL'};
    const s3 = `<section class="block" id="s3"><h2>📚 编程学习知识库</h2><div class="sub">每日 3 个知识点 · 历史全部保留 · 积少成多</div>
      ${Object.keys(knames).map(k => { const e = kn[k]; return e ? `
        <div class="kcard"><h3><span class="tag">${knames[k]}</span>${esc(e.title)}</h3>
        <p>${esc(e.content)}</p>${e.code ? `<pre>${esc(e.code)}</pre>` : ''}
        <div style="font-size:12px;color:#999;margin-top:8px">第 ${e.day_n} / ${e.total} 课</div></div>` : ''; }).join('')}
    </section>`;

    // 板块4
    const pnames = {chatgpt: 'ChatGPT', gemini: 'Gemini', claude: 'Muse', image: '图像生成'};
    const s4 = `<section class="block" id="s4"><h2>💬 AI 提示词库</h2><div class="sub">每日 4 条 · 按分类整理 · 点击复制即用</div>
      ${Object.keys(pnames).map((c,pi) => { const p = d.prompts[c]; return p ? `
        <div class="prompt-box"><h3>「${pnames[c]}」${esc(p.title)}</h3>
        <pre id="pr-${pi}">${esc(p.prompt)}</pre>
        <button onclick="copyPrompt(${pi})">复制提示词</button>
        <span style="font-size:12px;color:#999;margin-left:10px">第 ${p.day_n} / ${p.total} 条</span></div>` : ''; }).join('')}
    </section>`;

    // 板块5
    const tools = d.tools;
    const s5 = `<section class="block" id="s5"><h2>🧰 AI 工具导航站</h2><div class="sub">自动生成目录 · 按分类整理 · 本周新增标红</div>
      ${tools.new_this_week.length ? `<div class="catchip">🆕 本周新增（${tools.new_this_week.length}）</div>
        <div class="toolgrid">${tools.new_this_week.map(t =>
          `<div class="tool"><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a><span class="new">NEW</span><p>${esc(t.desc)}</p></div>`).join('')}</div>` : ''}
      ${Object.keys(tools.categories).map(c => `
        <div class="catchip">${esc(c)}（${tools.categories[c].length}）</div>
        <div class="toolgrid">${tools.categories[c].map(t =>
          `<div class="tool"><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a><p>${esc(t.desc)}</p></div>`).join('')}</div>`).join('')}
    </section>`;

    list.innerHTML = s1 + s2 + s3 + s4 + s5;
    window.scrollTo(0, 0);
  } catch (e) { list.innerHTML = '<div id="empty">加载失败，请稍后重试。</div>'; }
}

function swTab(prefix, i, btn) {
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll(`[id^="${prefix}-tab"]`).forEach(el => el.style.display = 'none');
  document.getElementById(`${prefix}-tab${i}`).style.display = 'block';
}
function copyPrompt(i) {
  const t = document.getElementById('pr-' + i).innerText;
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('提示词已复制')).catch(() => alert('复制失败'));
  else alert('请手动复制');
}
init();
</script>
</body>
</html>
